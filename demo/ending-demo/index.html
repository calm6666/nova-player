<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova · 片尾 / 跳过片头片尾场景演示</title>
    <style>
      * { box-sizing: border-box; }
      body {
        background: #0d0d0f;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        margin: 0;
      }
      .toolbar {
        align-items: center;
        background: #17181c;
        border-bottom: 1px solid #2b2d33;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 48px;
        padding: 8px 12px;
      }
      .toolbar button {
        background: #262932;
        border: 1px solid #3a3e49;
        border-radius: 6px;
        color: #e7e9ee;
        cursor: pointer;
        font-size: 13px;
        padding: 7px 12px;
      }
      .toolbar button:hover { background: #333846; }
      .toolbar button.active {
        background: #00a1d6;
        border-color: #00a1d6;
        color: #fff;
      }
      .toolbar .tip {
        color: #8f96a3;
        font-size: 12px;
        margin-left: auto;
      }
      #player {
        height: 720px;
        width: 1280px;
      }
      /* 截图模式：隐藏工具栏，播放器顶到左上角 */
      body.screenshot-mode .toolbar { display: none; }
    </style>
  </head>
  <body>
    <div class="toolbar" id="toolbar">
      <button type="button" data-mode="standard">标准片尾</button>
      <button type="button" data-mode="ogv">电视剧 OGV 片尾</button>
      <button type="button" data-mode="music">音乐模式 Top</button>
      <button type="button" data-mode="interactive">互动视频片尾</button>
      <button type="button" data-mode="embedded">外链片尾</button>
      <button type="button" data-mode="share">片尾分享面板（标准）</button>
      <button type="button" data-mode="ogv-share">片尾分享面板（OGV）</button>
      <button type="button" data-mode="controls">标准控制栏</button>
      <button type="button" data-mode="wide">宽屏控制栏</button>
      <button type="button" data-mode="quality">清晰度菜单</button>
      <button type="button" data-mode="rate">倍速菜单</button>
      <button type="button" data-mode="embedded-play">外链播放中（控制栏 + 推荐条）</button>
      <button type="button" data-mode="settings">设置 · 跳过头尾</button>
      <button type="button" data-mode="settings-more">设置 · 第二页</button>
      <button type="button" data-mode="points">进度条片头 / 片尾断点</button>
      <span class="tip">所有数据为演示数据，接口见 docs/api.md §7.5</span>
    </div>
    <div id="player"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
